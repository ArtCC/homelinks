<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homelinks - Login</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="login-page">
  <script>
    // Apply theme before render to avoid flash
    (function () {
      const theme = localStorage.getItem("theme") || "auto";
      if (theme === "light") {
        document.body.classList.add("theme-light");
      } else if (theme === "dark") {
        document.body.classList.add("theme-dark");
      }
      // auto = no class, uses prefers-color-scheme
    })();
  </script>

  <main class="container auth-container">
    <header class="header auth-header">
      <h1>
        <img src="/icon.svg" alt="" class="icon-logo">
        Homelinks
      </h1>
      <p class="auth-kicker">Your services, one click away</p>
    </header>

    <section class="form-card auth-card" aria-labelledby="login-title">
      <h2 id="login-title">Welcome back</h2>
      <p class="auth-intro">Sign in to manage your Docker services.</p>
      <form id="login-form">
        <label>
          Email
          <input type="email" id="email" placeholder="you@example.com" required />
        </label>
        <label>
          Password
          <input type="password" id="password" placeholder="Your password" required />
        </label>
        <div id="login-error" class="form-error" hidden></div>
        <div class="form-actions">
          <button type="submit">Sign in</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/login.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>

</html>
