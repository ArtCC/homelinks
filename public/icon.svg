<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square with gradient -->
  <rect width="64" height="64" rx="14" fill="url(#grad)"/>
  <!-- House silhouette (no door cutout for clean background) -->
  <path d="M32 12 L8 31 h8 v25 h32 V31 h8 L32 12 z" fill="white"/>
  <!-- Link icon: two C-arcs + connecting bar, same purple, smaller, centered -->
  <g transform="translate(32,40) scale(1.0) translate(-12,-12)"
     stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M9 17H7A5 5 0 0 1 7 7h2"/>
    <path d="M15 7h2a5 5 0 1 1 0 10h-2"/>
    <line x1="8" y1="12" x2="16" y2="12"/>
  </g>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
</svg>
